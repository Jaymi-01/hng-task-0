<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Us</title>
    <link rel="stylesheet" href="contact.css" />
  </head>
  <body>
    <div id="header"></div>

    <main class="contact-container">
      <h1>Contact Us</h1>
      <form id="contact-form" novalidate>
        <div class="form-group">
          <label for="contact-name">Full Name</label>
          <input
            type="text"
            id="contact-name"
            name="name"
            data-testid="test-contact-name"
            aria-describedby="test-contact-error-name"
            required
          />
          <p
            id="test-contact-error-name"
            class="error-message"
            data-testid="test-contact-error-name"
          ></p>
        </div>

        <div class="form-group">
          <label for="contact-email">Email</label>
          <input
            type="email"
            id="contact-email"
            name="email"
            data-testid="test-contact-email"
            aria-describedby="test-contact-error-email"
            required
          />
          <p
            id="test-contact-error-email"
            class="error-message"
            data-testid="test-contact-error-email"
          ></p>
        </div>

        <div class="form-group">
          <label for="contact-subject">Subject</label>
          <input
            type="text"
            id="contact-subject"
            name="subject"
            data-testid="test-contact-subject"
            aria-describedby="test-contact-error-subject"
            required
          />
          <p
            id="test-contact-error-subject"
            class="error-message"
            data-testid="test-contact-error-subject"
          ></p>
        </div>

        <div class="form-group">
          <label for="contact-message">Message</label>
          <textarea
            id="contact-message"
            name="message"
            rows="5"
            data-testid="test-contact-message"
            aria-describedby="test-contact-error-message"
            required
          ></textarea>
          <p
            id="test-contact-error-message"
            class="error-message"
            data-testid="test-contact-error-message"
          ></p>
        </div>

        <button type="submit" data-testid="test-contact-submit">Submit</button>
        <p
          id="test-contact-success"
          class="success-message"
          data-testid="test-contact-success"
        ></p>
      </form>
    </main>

    <script src="header.js"></script>
    <script src="contact.js"></script>
  </body>
</html>
